# --- 1. BLACK METAL ROSE PALETTE ---
# Define colors based on Base16 Black Metal Rose
bm_bg="#121212"
bm_gray="#1c1c1c"
bm_fg="#c1c1c1"
bm_rose="#999900"
bm_red="#5f8787"
bm_light_gray="#333333"

# --- 2. DRACULA PLUGIN CONFIGURATION ---
set -g @plugin 'dracula/tmux'

# Map Dracula variables to Black Metal Rose
set -g @dracula-colors "
  white='$bm_fg'
  gray='$bm_gray'
  dark_gray='$bm_bg'
  light_purple='$bm_rose'
  dark_purple='$bm_light_gray'
  cyan='#eeeeee'
  green='$bm_rose'
  orange='#aaaaaa'
  red='$bm_red'
  purple='$bm_rose'
  pink='#444444'
  yellow='#a8a8a8'
"

# Dracula Functionality Options
set -g @dracula-show-powerline false
set -g @dracula-show-flags true
set -g @dracula-refresh-rate 5
set -g @dracula-plugins "cpu-usage ram-usage network" # Choose your desired plugins

# --- 3. LAYOUT & STYLE (Mixing your UI with Dracula) ---
set-option -g status-position top
set -g status-style "bg=$bm_bg,fg=$bm_fg" # Removed bg=default to make it visible

# Borders
set -g pane-border-style "fg=$bm_light_gray"
set -g pane-active-border-style "fg=$bm_red"

# Mimicking your status-left
# Dracula uses @dracula-show-left-icon as its status-left base
set -g @dracula-show-left-icon "#[fg=$bm_rose,bold] #S #[default]"
set -g @dracula-left-icon-padding 0

# Window Status (Your specific format)
# Note: These must come AFTER the dracula plugin is initialized if using TPM
setw -g window-status-current-style "fg=black,bg=$bm_rose"
setw -g window-status-current-format " #I #W "

# Message and Mode styles
set -g mode-style "fg=black,bg=$bm_rose"
set -g message-style "fg=yellow,bg=black,bold"
